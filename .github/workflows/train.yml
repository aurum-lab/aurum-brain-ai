name: Train & Release Aurum Brain AI

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'scripts/**'
      - '.github/workflows/train.yml'
  workflow_dispatch:
    inputs:
      base_model:
        description: 'Base model (default: Qwen2.5-1.5B-Instruct, lebih cepat)'
        required: false
        default: 'Qwen/Qwen2.5-1.5B-Instruct'
      epochs:
        description: 'Training epochs (default: 2)'
        required: false
        default: '2'

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 240  # 4 jam, sisa banyak untuk safety margin
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Free disk space
        run: |
          # Hapus stuff yang tidak dipakai untuk hemat space
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          # PyTorch CPU version
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install transformers peft datasets accelerate sentencepiece protobuf
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential cmake git
          df -h

      - name: Build dataset
        run: |
          python scripts/build_dataset.py
          echo "Dataset size: $(wc -l < data/train.jsonl) lines"

      - name: Build llama.cpp (untuk quantize)
        run: |
          git clone --depth 1 https://github.com/ggerganov/llama.cpp
          cd llama.cpp
          cmake -B build -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_SERVER=OFF
          cmake --build build --config Release -j 2 --target llama-quantize
          ln -sf llama-quantize build/bin/quantize 2>/dev/null || true
          ls -la build/bin/ | grep -i quantize

      - name: Train model (LoRA fine-tuning)
        env:
          # Default ke model 1.5B supaya cepat (15-30 menit)
          # Bisa override via workflow_dispatch input
          AURUM_BASE_MODEL: ${{ github.event.inputs.base_model || 'Qwen/Qwen2.5-1.5B-Instruct' }}
          EPOCHS: ${{ github.event.inputs.epochs || '2' }}
          BATCH_SIZE: '1'
          GRAD_ACCUM: '4'
          MAX_LEN: '768'
          LORA_R: '16'
          LORA_ALPHA: '32'
        run: |
          echo "=== Training config ==="
          echo "Base: $AURUM_BASE_MODEL"
          echo "Epochs: $EPOCHS"
          echo "Max len: $MAX_LEN"
          echo "LoRA r=$LORA_R, alpha=$LORA_ALPHA"
          echo ""
          echo "=== Free memory before training ==="
          free -h
          echo ""
          python scripts/train.py

      - name: Verify GGUF output
        run: |
          ls -la out/
          if [ ! -f out/aurum-brain-q4_k_m.gguf ]; then
            echo "ERROR: GGUF file tidak ditemukan!"
            exit 1
          fi
          echo "GGUF size: $(du -h out/aurum-brain-q4_k_m.gguf)"
          python3 -c "
          import struct
          with open('out/aurum-brain-q4_k_m.gguf', 'rb') as f:
            magic = f.read(4)
            print(f'Magic: {magic}')
            assert magic == b'GGUF', 'Invalid GGUF file'
            version = struct.unpack('<I', f.read(4))[0]
            print(f'Version: {version}')
            print('OK GGUF valid')
          "

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aurum-brain-gguf
          path: |
            out/aurum-brain-q4_k_m.gguf
            out/merged/
            data/system_prompt.txt
          retention-days: 90

      - name: Upload to Hugging Face Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO_ID: arissuga/aurum-brain-ai
          GITHUB_SHA: ${{ github.sha }}
        run: |
          pip install -q huggingface_hub
          python scripts/upload_to_hf.py

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="v$(date +%Y.%m.%d)-${GITHUB_SHA::7}"
          DATASET_SIZE=$(wc -l < data/train.jsonl)
          BASE_MODEL="${{ github.event.inputs.base_model || 'Qwen/Qwen2.5-1.5B-Instruct' }}"
          
          # Bikin release notes file (hindari YAML multi-line issues)
          cat > /tmp/release_notes.md << RELEASEEOF
          ## Aurum Brain AI - Custom Fine-Tuned Model

          Model AI buatan sendiri, fine-tuned untuk Bahasa Indonesia + coding + web dev.

          ### Spesifikasi
          - Base: \`$BASE_MODEL\`
          - Fine-tune: LoRA r=16, alpha=32
          - Dataset: $DATASET_SIZE percakapan Bahasa Indonesia
          - Quantization: Q4_K_M
          - Training: 2 epochs, max_len=768

          ### Cara Pakai

          **PocketPal (HP)**: Download GGUF → Import → set system prompt dari \`system_prompt.txt\`

          **Ollama**:
          \`\`\`bash
          ollama create aurum-brain -f modelfile
          ollama run aurum-brain
          \`\`\`

          **llama.cpp**:
          \`\`\`bash
          ./main -m aurum-brain-q4_k_m.gguf -p 'Halo, siapa kamu?'
          \`\`\`

          Commit: ${GITHUB_SHA::7}
          RELEASEEOF
          
          gh release create "$VER" \
            out/aurum-brain-q4_k_m.gguf \
            data/system_prompt.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "Aurum Brain AI $VER" \
            --notes-file /tmp/release_notes.md
