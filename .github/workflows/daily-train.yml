name: Daily Train - AI belajar tiap hari (Optimized)

on:
  schedule:
    # Sekali sehari jam 00:00 UTC = 07:00 WIB
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: 'Force training (skip dataset expansion check)'
        required: false
        default: 'false'

permissions:
  contents: write
  actions: write

concurrency:
  group: "daily-train"
  cancel-in-progress: true

jobs:
  daily-train:
    runs-on: ubuntu-latest
    timeout-minutes: 300  # 5 jam max
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc 2>/dev/null || true
          df -h

      # === CACHE llama.cpp (FULL DIR - include convert script) ===
      - name: Cache llama.cpp
        id: llama-cache
        uses: actions/cache@v4
        with:
          path: llama.cpp
          key: llama-cpp-${{ runner.os }}-${{ hashFiles('scripts/train.py') }}
          restore-keys: |
            llama-cpp-${{ runner.os }}-

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install transformers peft datasets accelerate sentencepiece protobuf

      - name: Build llama.cpp (only if cache miss)
        if: steps.llama-cache.outputs.cache-hit != 'true'
        run: |
          set -e
          # Handle case where directory exists from cache restore (partial key match)
          if [ -d "llama.cpp" ]; then
            echo "llama.cpp directory exists, updating..."
            cd llama.cpp
            git fetch --depth 1 origin
            git reset --hard origin/master
          else
            git clone --depth 1 https://github.com/ggerganov/llama.cpp
            cd llama.cpp
          fi
          cmake -B build -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_SERVER=OFF
          cmake --build build --config Release -j 2 --target llama-quantize 2>&1 | tail -20
          # Coba kedua nama binary yang mungkin (llama-quantize atau quantize)
          if [ -f build/bin/llama-quantize ]; then
            ln -sf llama-quantize build/bin/quantize 2>/dev/null || true
          elif [ -f build/bin/quantize ]; then
            ln -sf quantize build/bin/llama-quantize 2>/dev/null || true
          else
            echo "WARNING: quantize binary not found, trying to build quantize target"
            cmake --build build --config Release -j 2 --target quantize 2>&1 | tail -10
            if [ -f build/bin/quantize ]; then
              ln -sf quantize build/bin/llama-quantize
            fi
          fi
          # Verifikasi
          ls -la build/bin/ | grep -E "quantize|llama-quantize" || echo "WARNING: quantize not found"

      # Ensure quantize symlink exists even on cache hit
      - name: Ensure quantize symlink (cache hit)
        if: steps.llama-cache.outputs.cache-hit == 'true'
        run: |
          cd llama.cpp
          if [ -f build/bin/llama-quantize ] && [ ! -f build/bin/quantize ]; then
            ln -sf llama-quantize build/bin/quantize
          elif [ -f build/bin/quantize ] && [ ! -f build/bin/llama-quantize ]; then
            ln -sf quantize build/bin/llama-quantize
          fi
          ls -la build/bin/ | grep -E "quantize|llama-quantize" || echo "WARNING: quantize not found"

      - name: Expand dataset (hanya kalau < 150 convos)
        run: |
          CURRENT_SIZE=$(python3 -c "
          import json
          try:
            with open('data/conversations_source.json') as f:
              print(len(json.load(f)))
          except:
            print(0)
          " 2>/dev/null || echo 0)
          
          echo "Current dataset size: $CURRENT_SIZE conversations"
          
          if [ "$CURRENT_SIZE" -lt 150 ]; then
            echo "Dataset <150, expand..."
            python scripts/expand_dataset.py || echo "expand_dataset.py failed, continuing..."
            python scripts/expand_agent_dataset.py || echo "expand_agent_dataset.py failed, continuing..."
          else
            echo "Dataset >=150, skip expand (cap reached)"
          fi

      - name: Build dataset (JSONL)
        run: |
          python scripts/build_dataset.py
          echo "Final dataset: $(wc -l < data/train.jsonl) lines"

      - name: Train model (1 epoch daily, 3 epoch weekly)
        env:
          AURUM_BASE_MODEL: 'Qwen/Qwen2.5-3B-Instruct'
          EPOCHS: '1'  # Daily: 1 epoch only (lebih cepat)
          BATCH_SIZE: '1'
          GRAD_ACCUM: '4'
          MAX_LEN: '512'  # Kurangi dari 768 → 512 (hemat VRAM/waktu)
          LORA_R: '16'
          LORA_ALPHA: '32'
        run: |
          echo "=== Daily Training - $(date) ==="
          python scripts/train.py

      - name: Verify GGUF output
        run: |
          ls -la out/
          if [ ! -f out/aurum-brain-q4_k_m.gguf ]; then
            echo "ERROR: GGUF file tidak ditemukan!"
            echo "Files in out/:"
            ls -la out/
            exit 1
          fi
          echo "GGUF size: $(du -h out/aurum-brain-q4_k_m.gguf)"
          python3 -c "
          import struct
          with open('out/aurum-brain-q4_k_m.gguf', 'rb') as f:
            magic = f.read(4)
            assert magic == b'GGUF', 'Invalid GGUF'
            version = struct.unpack('<I', f.read(4))[0]
            print(f'GGUF v{version} valid')
          "

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aurum-brain-daily-${{ github.run_id }}
          path: |
            out/aurum-brain-q4_k_m.gguf
            data/system_prompt.txt
            data/expansion_log.json
          retention-days: 7

      - name: Cleanup old releases (keep 8 terakhir = 2 hari)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Cleanup old releases (keep 8 latest) ==="
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 2>/dev/null | \
            awk 'NR > 8 {print $1}' | \
            while read -r tag; do
              if [ -n "$tag" ]; then
                echo "Deleting old release: $tag"
                gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
              fi
            done
          echo "Remaining releases:"
          gh release list --repo "$GITHUB_REPOSITORY" --limit 3

      - name: Create daily release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="daily-$(date +%Y.%m.%d-%H)"
          DATASET_SIZE=$(wc -l < data/train.jsonl)
          
          # Check both release AND tag (orphan tags won't show in release list)
          if gh release view "$VER" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$VER" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          elif git ls-remote --tags origin | grep -q "refs/tags/$VER$"; then
            echo "Orphan tag $VER exists, deleting..."
            git push origin --delete "$VER" 2>/dev/null || true
            gh release delete "$VER" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          fi
          
          cat > /tmp/release_notes.md << 'RELEASEEOF'
          ## Aurum Brain AI - Build $VER

          AI model auto-trained. Makin pintar tiap hari! 🧠

          ### Spesifikasi
          - Base: Qwen/Qwen2.5-3B-Instruct
          - Fine-tune: LoRA r=16, alpha=32
          - Dataset: $DATASET_SIZE percakapan Bahasa Indonesia
          - Quantization: Q4_K_M (~1GB)
          - Training: 1 epoch, max_len=512 (daily)

          ### Cara Pakai
          1. Download GGUF
          2. Import ke PocketPal / Ollama / llama.cpp
          3. Set system prompt dari system_prompt.txt

          Auto-trained: $(date -u)
          RELEASEEOF
          
          gh release create "$VER" \
            out/aurum-brain-q4_k_m.gguf \
            data/system_prompt.txt \
            data/expansion_log.json \
            --repo "$GITHUB_REPOSITORY" \
            --title "Aurum Brain AI $VER" \
            --notes-file /tmp/release_notes.md \
            --latest
          
          echo "RELEASE_TAG=$VER" >> $GITHUB_ENV
          echo "DATASET_SIZE=$DATASET_SIZE" >> $GITHUB_ENV
          echo "DOWNLOAD_URL=https://github.com/$GITHUB_REPOSITORY/releases/download/$VER/aurum-brain-q4_k_m.gguf" >> $GITHUB_ENV

      - name: Notify Telegram
        if: success()
        run: |
          curl -s -X POST "https://aurum-telegram-bot.cakagus.workers.dev/webhook" \
            -H "Content-Type: application/json" \
            -d "{
              \"event\": \"training_complete\",
              \"release_tag\": \"${RELEASE_TAG}\",
              \"dataset_size\": \"${DATASET_SIZE}\",
              \"model_info\": \"Qwen2.5-3B Q4_K_M (1 epoch)\",
              \"download_url\": \"${DOWNLOAD_URL}\"
            }" || echo "Telegram notify failed (OK)"

      - name: Save expansion log
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f data/expansion_log.json ]; then exit 0; fi
          
          CONTENT=$(base64 -w 0 data/expansion_log.json)
          
          FILE_SHA=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/data/expansion_log.json" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('sha',''))" 2>/dev/null || echo "")
          
          SHA_JSON=""
          if [ -n "$FILE_SHA" ]; then SHA_JSON=",\"sha\":\"$FILE_SHA\""; fi
          
          curl -s -X PUT \
            -H "Authorization: token $GH_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/data/expansion_log.json" \
            -d "{\"message\":\"chore: update expansion log [skip ci]\",\"content\":\"$CONTENT\",\"branch\":\"main\"$SHA_JSON}" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print(f'OK: {d[\"commit\"][\"sha\"][:7]}') if d.get('commit') else print(f'Skip: {d.get(\"message\",\"?\")}')" \
            || echo "Commit failed (OK)"